<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Simran ❤️</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="visuals.css">
    <link rel="stylesheet" href="mobile.css">
</head>
<body onclick="handleScreenClick(event)">

    <div class="glass-card">
        <div class="app-header">
            <span>COSMIC_CONNECTION.SYS</span>
            <span>FEB 14, 2026</span>
        </div>
        
        <div class="card-content">
            <h1 id="title-display" class="title">For My Favorite Person ❤️</h1>
            
            <p id="start-quote" class="welcome-quote">
                "Distance means nothing when someone means everything."
            </p>

            <div class="typewriter-container">
                <div id="typewriter-output"></div>
            </div>
        </div>

        <button type="button" class="btn-primary" id="action-btn" onclick="nextChapter()">BEGIN</button>

        <div id="proposal-buttons" style="display: none; flex-direction: column; gap: 20px; margin: 30px 0 20px 0;">
    <button id="yes-love-btn" class="btn-primary" style="display: none; background: linear-gradient(135deg, #ff3366, #ff85a2); color: white;">
        Yes!! I Love You ❤️
    </button>
    <button id="no-dodge-btn" class="btn-primary" style="display: none; background: #333; color: #ccc;">
        No...
    </button>
</div>

        <div class="progress-track">
            <div id="bar"></div>
        </div>
    </div>

    <audio id="bg-music" loop>
        <source src="bg-music.mp3" type="audio/mpeg">
    </audio>

    <script src="config.js"></script>
    <script src="typewriter-engine.js"></script>
    <script src="fx.js"></script>
    <script src="app.js"></script>
</body>
</html>
